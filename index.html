<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusorSHOP — Інтернет-магазин техніки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">Musor<span>SHOP</span></div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="#">Головна</a></li>
                <li><a href="#">Одяг</a></li>
                <li><a href="#">Прикраси</a></li>
                <li><a href="#">Аксесуари</a></li>
            </ul>
        </nav>
        <div class="user-actions">
            <button class="btn-cart">🛒 Кошик (<span class="cart-counter">0</span>)</button>
        </div>
    </header>

    <main class="page-layout">
        <aside class="sidebar">
            <h3>Категорії</h3>
            <ul class="filter-list">
                <li><label><input type="checkbox"> Чоловічий одяг.</label></li>
                <li><label><input type="checkbox"> Прикраси.</label></li>
                <li><label><input type="checkbox"> Аксесуари.</label></li>
            </ul>
            <h3 class="price-filter">Ціна</h3>
            <input type="range" min="1" max="700" class="price-slider">
        </aside>

        <section class="products-content">
            <h2>Популярні товари</h2>
            <div class="loader-container" id="loader">
                <div class="spinner"></div>
                <p>Завантаження...</p>
            </div>
            <div class="products-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p> MusorSHOP. Всі права майже захищено &copy; 2026.</p>
            <ul class="footer-links">
                <li><a href="#">Гарантія та сервіс</a></li>
                <li><a href="#">Доставка і оплата</a></li>
            </ul>
        </div>
    </footer>
    <div class="modal-overlay hidden" id="cartOverlay">
        <div class="modal-window">
            <div class="modal-header">
                <h2>Ваш кошик</h2>
                <button class="close-btn" id="closeCartBtn">&times;</button>
            </div>
            <div class="cart-items" id="cartItemsContainer">
                <p>Кошик порожній</p>
            </div>
            <div class="modal-footer">
                <h3>Разом: $<span id="cartTotalSum">0</span></h3>
                <a href="checkout.html" class="btn btn-primary" id="checkoutBtn">Оформити замовлення</a>
            </div>
        </div>
    </div>
    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
